workflows:
  android-workflow:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: manufacturing_app
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Build Android Release APK
        script: |
          flutter build apk --release
      - name: Copy APK to Export Directory
        script: |
          mkdir -p $CM_EXPORT_DIR
          cp build/app/outputs/flutter-apk/app-release.apk $CM_EXPORT_DIR/manufacturing-app-release.apk
          echo "APK successfully copied to $CM_EXPORT_DIR"
          ls -la $CM_EXPORT_DIR
    artifacts:
      - $CM_EXPORT_DIR/*.apk
      - manufacturing_app/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - amitsagar121001@gmail.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: manufacturing_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS app (unsigned)
        script: |
          flutter build ios --release --no-codesign
          echo "Flutter build ios finished with exit code $?"
      - name: Find and Package iOS App
        script: |
          mkdir -p $CM_EXPORT_DIR

          echo "=== Full build directory tree ==="
          find build -name "*.app" -type d 2>/dev/null || true
          echo ""
          echo "=== Checking known paths ==="

          # Try all known paths where Runner.app could be
          RUNNER_APP=""
          for path in \
            "build/ios/iphoneos/Runner.app" \
            "build/ios/Release-iphoneos/Runner.app" \
            "build/ios/Debug-iphoneos/Runner.app" \
            "build/ios/Profile-iphoneos/Runner.app"; do
            if [ -d "$path" ]; then
              RUNNER_APP="$path"
              echo "FOUND Runner.app at: $path"
              break
            else
              echo "NOT at: $path"
            fi
          done

          # Fallback: search everywhere
          if [ -z "$RUNNER_APP" ]; then
            echo "Searching entire build/ directory..."
            RUNNER_APP=$(find build -name "Runner.app" -type d 2>/dev/null | head -1)
          fi

          if [ -z "$RUNNER_APP" ]; then
            echo ""
            echo "========================================="
            echo "ERROR: Runner.app not found anywhere!"
            echo "Full build tree for debugging:"
            echo "========================================="
            find build -maxdepth 6 -type d 2>/dev/null || true
            echo ""
            echo "All files in build/ios/:"
            find build/ios -maxdepth 4 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "Using Runner.app from: $RUNNER_APP"
          echo "Runner.app size:"
          du -sh "$RUNNER_APP"

          # Create proper IPA with Payload/ structure
          PAYLOAD_DIR=$(mktemp -d)/Payload
          mkdir -p "$PAYLOAD_DIR"
          cp -r "$RUNNER_APP" "$PAYLOAD_DIR/Runner.app"
          cd "$(dirname "$PAYLOAD_DIR")"
          zip -r "$CM_EXPORT_DIR/manufacturing-app.ipa" Payload
          echo "Created manufacturing-app.ipa"

          # Also zip the raw .app
          cd "$(dirname "$RUNNER_APP")"
          zip -r "$CM_EXPORT_DIR/Runner-app.zip" "$(basename "$RUNNER_APP")"
          echo "Created Runner-app.zip"

          echo ""
          echo "=== Final Export Directory ==="
          ls -la $CM_EXPORT_DIR
    artifacts:
      - $CM_EXPORT_DIR/*.ipa
      - $CM_EXPORT_DIR/*.zip
    publishing:
      email:
        recipients:
          - amitsagar121001@gmail.com
        notify:
          success: true
          failure: true
