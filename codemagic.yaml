workflows:
  android-workflow:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: manufacturing_app
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Build Android Release APK
        script: |
          flutter build apk --release
      - name: Copy APK to Export Directory
        script: |
          mkdir -p $CM_EXPORT_DIR
          cp build/app/outputs/flutter-apk/app-release.apk $CM_EXPORT_DIR/manufacturing-app-release.apk
          echo "APK successfully copied to $CM_EXPORT_DIR"
          ls -la $CM_EXPORT_DIR
    artifacts:
      - $CM_EXPORT_DIR/*.apk
      - manufacturing_app/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - amitsagar121001@gmail.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: manufacturing_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS without code signing
        script: |
          flutter build ios --release --no-codesign
      - name: Package iOS App and IPA into Export Directory
        script: |
          mkdir -p $CM_EXPORT_DIR
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cd build/ios/iphoneos
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r "$CM_EXPORT_DIR/manufacturing-app-unsigned.ipa" Payload
            zip -r "$CM_EXPORT_DIR/Runner-app.zip" Runner.app
            echo "Exported IPA and Runner-app.zip to $CM_EXPORT_DIR"
            ls -la $CM_EXPORT_DIR
          else
            echo "Runner.app not found in build/ios/iphoneos"
            find build -maxdepth 4
          fi
    artifacts:
      - $CM_EXPORT_DIR/*.ipa
      - $CM_EXPORT_DIR/*.zip
      - manufacturing_app/build/ios/iphoneos/*.ipa
    publishing:
      email:
        recipients:
          - amitsagar121001@gmail.com
        notify:
          success: true
          failure: true
