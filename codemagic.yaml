workflows:
  android-workflow:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: manufacturing_app
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Build Android Release APK
        script: |
          flutter build apk --release
      - name: Copy APK to Export Directory
        script: |
          mkdir -p $CM_EXPORT_DIR
          cp build/app/outputs/flutter-apk/app-release.apk $CM_EXPORT_DIR/manufacturing-app-release.apk
          echo "APK successfully copied to $CM_EXPORT_DIR"
          ls -la $CM_EXPORT_DIR
    artifacts:
      - $CM_EXPORT_DIR/*.apk
      - manufacturing_app/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - amitsagar121001@gmail.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: manufacturing_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS app (unsigned)
        script: |
          flutter build ios --release --no-codesign
      - name: Debug - show build output
        script: |
          echo "=== Listing build/ios/iphoneos ==="
          ls -la build/ios/iphoneos/ || echo "iphoneos dir not found"
          echo "=== Looking for Runner.app ==="
          find build -name "Runner.app" -type d 2>/dev/null || echo "Runner.app not found anywhere"
      - name: Package Runner.app into IPA and ZIP
        script: |
          set -e
          mkdir -p $CM_EXPORT_DIR

          # Find Runner.app wherever it was built
          RUNNER_APP=$(find build -name "Runner.app" -type d | head -1)

          if [ -z "$RUNNER_APP" ]; then
            echo "ERROR: Runner.app not found anywhere in build/"
            find build -maxdepth 5 -type d
            exit 1
          fi

          echo "Found Runner.app at: $RUNNER_APP"

          # Create proper IPA structure: Payload/Runner.app
          TEMP_DIR=$(mktemp -d)
          mkdir -p "$TEMP_DIR/Payload"
          cp -r "$RUNNER_APP" "$TEMP_DIR/Payload/Runner.app"

          # Create unsigned IPA (proper format with Payload/ folder)
          cd "$TEMP_DIR"
          zip -r "$CM_EXPORT_DIR/manufacturing-app.ipa" Payload
          echo "Created manufacturing-app.ipa"

          # Also zip the raw .app bundle
          cd "$(dirname "$RUNNER_APP")"
          zip -r "$CM_EXPORT_DIR/Runner-app.zip" Runner.app
          echo "Created Runner-app.zip"

          echo "=== Export Directory Contents ==="
          ls -la $CM_EXPORT_DIR
    artifacts:
      - $CM_EXPORT_DIR/*.ipa
      - $CM_EXPORT_DIR/*.zip
    publishing:
      email:
        recipients:
          - amitsagar121001@gmail.com
        notify:
          success: true
          failure: true
