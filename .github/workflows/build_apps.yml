name: Build Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: manufacturing_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: manufacturing_app
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-app-android-release
          path: manufacturing_app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: manufacturing_app
        run: flutter pub get

      - name: Build iOS (No codesign for ad-hoc / simulator / testing)
        working-directory: manufacturing_app
        run: flutter build ios --release --no-codesign

      - name: Package Payload into unsigned IPA
        working-directory: manufacturing_app
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r manufacturing-app-unsigned.ipa Payload

      - name: Upload iOS IPA / App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-app-ios-release
          path: |
            manufacturing_app/build/ios/iphoneos/manufacturing-app-unsigned.ipa
            manufacturing_app/build/ios/iphoneos/Runner.app
